<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <nav>
      <a href="{{ '/' | relative_url }}" class="site-title">~/mimx</a>
      <span class="nav-links">
        <a href="{{ '/' | relative_url }}">home</a>
        <a href="{{ '/posts/' | relative_url }}">posts</a>
        <a href="{{ '/concepts/' | relative_url }}">concepts</a>
        <a href="{{ '/technology/' | relative_url }}">technology</a>
        <a href="{{ '/engineering/' | relative_url }}">engineering</a>
        <a href="{{ '/field-notes/' | relative_url }}">field-notes</a>
        <a href="{{ '/news/' | relative_url }}">news</a>
      </span>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer>
    <p>© {{ site.time | date: '%Y' }} Mohamed Yehia &mdash; <a href="https://github.com/mimx">github</a></p>
  </footer>
  <script>
    // kramdown renders ```mermaid as <pre><code class="language-mermaid">
    // convert them to <div class="mermaid"> so Mermaid.js picks them up
    document.querySelectorAll('pre > code.language-mermaid').forEach(function(code) {
      var div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });

    // Open all links inside post content and listings in a new tab
    // Excludes anchor-only links (#section) which should stay on the page
    document.querySelectorAll('.post-content a, .post-list a').forEach(function(link) {
      var href = link.getAttribute('href') || '';
      if (!href.startsWith('#')) {
        link.setAttribute('target', '_blank');
        link.setAttribute('rel', 'noopener noreferrer');
      }
    });
  </script>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: true, theme: 'dark' });
  </script>
</body>
</html>
