---
layout: default
---
<article class="post">
  <header class="post-header">
    <p class="post-meta">
      <span class="prompt">$</span> cat posts/{{ page.slug }}.md
    </p>
    <h1>{{ page.title }}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time>
    {% if page.tags %}<div class="tags">{% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}</div>{% endif %}
  </header>
  <div class="post-content">
    {{ content }}
  </div>
  <a href="{{ '/posts/' | relative_url }}" class="back-link">← back to posts</a>
</article>

{% if page.wide %}
<script>
  document.querySelector('main').classList.add('wide');
</script>
{% endif %}
